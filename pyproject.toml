[project]
name = "image-pipeline"
version = "0.1.0"
description = "이미지 자동 수집 + 오탐 후보 검출 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "fastapi",          # 웹 API
    "uvicorn",          # FastAPI 를 실행하는 서버
    "httpx",            # 비동기 HTTP 클라이언트 (Node 의 fetch 역할)
    "pillow",           # 이미지 검사, 지각 해시
    "python-dotenv",    # .env 읽기
]

[project.optional-dependencies]
dev = ["pytest"]
# 검출 워커용. 무거워서 수집기만 쓸 때는 설치하지 않는다.
# GPU 로 돌리려면 torch 를 먼저 PyTorch 인덱스에서 설치한다 (README 참고).
detect = [
    "numpy",
    # YOLO ONNX 추론. GPU 판(CPU 로도 돈다). 1.27 부터는 CUDA 13 용이라 torch(cu128)의 CUDA 12 DLL 과 맞지 않는다.
    "onnxruntime-gpu>=1.20,<1.27",
    "torch",            # SwinV2 · DINOv2 백본과 head
    "torchvision",      # transformers 의 빠른 이미지 전처리기가 쓴다 (reference 도 설치했다)
    "transformers",     # Hugging Face 백본 로드
    "safetensors",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 저장소에 api/(Node), docs/, tests/ 등 다른 폴더가 있으므로 파이썬 패키지는 app 만이라고 알려 준다
[tool.setuptools.packages.find]
include = ["app*"]
