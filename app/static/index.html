<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이미지 수집기</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#e3e6ea; --accent:#2563eb;
          --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#e7e9ec; --muted:#9aa1ac; --line:#2c3038; --accent:#6ea0ff;
            --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text);
         font:15px/1.5 "Malgun Gothic", system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:15px; margin:0 0 12px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .row { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
  .site { display:flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--line); border-radius:8px; }
  .site small { color:var(--muted); }
  input[type=text], input[type=number] { padding:8px 10px; border:1px solid var(--line); border-radius:8px;
         background:var(--bg); color:var(--text); font:inherit; }
  #keywords { flex:1 1 320px; }
  button { padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card);
           color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.small { padding:2px 8px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .muted { color:var(--muted); }
  #message { min-height:1.5em; margin-top:8px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:6px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:normal; font-size:13px; }
  td.num { text-align:right; }
  tr.keyword td { font-weight:bold; background:var(--bg); }
  progress { width:120px; height:8px; vertical-align:middle; }
  .ratio { margin-left:6px; font-size:13px; }
  #limit { margin-top:8px; font-size:13px; }
  .error { white-space:normal; font-size:13px; }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--line); margin:0 0 12px; }
  .tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none;
                 color:var(--muted); padding:6px 12px; margin-bottom:-1px; }
  .tabs button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); font-weight:bold; }
  .tabs button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .count { display:inline-block; min-width:1.6em; margin-left:4px; padding:0 6px; border-radius:999px;
           background:var(--bg); color:var(--muted); font-size:12px; font-weight:normal; font-variant-numeric:tabular-nums; }
  .hint { font-size:13px; color:var(--muted); margin:0 0 8px; }
  .pager { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-top:12px; font-variant-numeric:tabular-nums; }
  .pager .total { margin-right:auto; font-size:13px; color:var(--muted); }
  .pager button { min-width:2.2em; padding:2px 8px; font-size:13px; }
  .pager button[aria-current="page"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .pager .gap { color:var(--muted); padding:0 2px; }
  ol.keywords { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); counter-reset:kw; }
  ol.keywords li { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; padding:6px 0;
                   border-bottom:1px solid var(--line); counter-increment:kw; font-variant-numeric:tabular-nums; }
  ol.keywords li::before { content:counter(kw); width:1.8em; text-align:right; color:var(--muted); font-size:13px; }
  ol.keywords li.held .kw { color:var(--muted); text-decoration:line-through; }
  ol.keywords .kw { font-weight:bold; flex:1 1 8em; min-width:0; overflow-wrap:anywhere; }
  ol.keywords .meta { font-size:13px; }
  ol.keywords .actions { display:flex; gap:4px; margin-left:auto; }
  ol.keywords .empty { color:var(--muted); font-size:13px; }
  ol.keywords .empty::before { content:none; }
  button.danger { color:var(--bad); }
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between">
    <h1>이미지 수집기</h1>
    <div class="row">
      <span id="running" class="muted"></span>
      <button id="toggle"></button>
    </div>
  </div>

  <section>
    <h2>수집 등록</h2>
    <div id="sites" class="row" style="margin-bottom:12px"></div>
    <div class="row">
      <input id="keywords" type="text" placeholder="키워드 (쉼표로 구분) 예: beach, sunset">
      <button id="submit" class="primary">실행</button>
    </div>
    <div id="limit" class="muted"></div>
    <div id="message"></div>
  </section>

  <section>
    <h2>키워드 목록</h2>
    <div class="tabs" role="tablist" data-group="list">
      <button id="tab-list-queued" role="tab" data-tab="queued" aria-controls="panel-list-queued">수집 중<span class="count" id="count-list-queued"></span></button>
      <button id="tab-list-collected" role="tab" data-tab="collected" aria-controls="panel-list-collected">수집 완료<span class="count" id="count-list-collected"></span></button>
    </div>
    <div id="panel-list-queued" role="tabpanel" data-group="list" data-tab="queued" aria-labelledby="tab-list-queued">
      <p class="hint">위에서부터 차례로 수집합니다. 보류한 키워드는 건너뜁니다.</p>
      <ol id="queued" class="keywords"></ol>
    </div>
    <div id="panel-list-collected" role="tabpanel" data-group="list" data-tab="collected" aria-labelledby="tab-list-collected" hidden>
      <p class="hint">수집을 마친 순서입니다.</p>
      <ol id="collected" class="keywords"></ol>
    </div>
  </section>

  <section id="progress-card">
    <h2>진행 상황</h2>
    <div class="tabs" role="tablist" data-group="progress">
      <button id="tab-progress-active" role="tab" data-tab="active" aria-controls="progress-panel">진행 상황<span class="count" id="count-progress-active"></span></button>
      <button id="tab-progress-collected" role="tab" data-tab="collected" aria-controls="progress-panel">수집 완료<span class="count" id="count-progress-collected"></span></button>
    </div>
    <div id="progress-panel" class="table-wrap" role="tabpanel">
      <table>
        <thead><tr>
          <th>사이트</th><th>상태</th><th title="확인한 장수 / 사이트에서 받을 수 있는 전체 장수">진행</th><th class="num">저장</th><th class="num">중복</th>
          <th class="num">건너뜀</th><th class="num">실패</th><th>비고</th>
        </tr></thead>
        <tbody id="progress"></tbody>
      </table>
    </div>
    <nav id="pager" class="pager" aria-label="진행 상황 페이지"></nav>
  </section>
</main>

<script>
// 화면은 서버 API 를 부르기만 한다. 수집은 서버가 하므로 이 탭을 닫아도 계속된다.
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};
const api = async (path, options) => {
  const response = await fetch(path, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
  return body;
};

const STATUS = {
  pending: ["대기", "muted"], running: ["수집 중", "ok"], rate_limited: ["한도 대기", "warn"],
  paused: ["일시 정지", "warn"], done: ["완료", "ok"], failed: ["실패", "bad"],
  collecting: ["수집 중", "ok"], collected: ["수집 완료", "ok"],
};
// 화면 상태: 고른 탭과 탭별 페이지. 탭은 브라우저에 기억해 새로고침해도 유지한다.
const PAGE_SIZE = 20;   // 진행 상황 한 페이지에 보여 줄 키워드 수
const remember = (key, fallback) => { try { return localStorage.getItem(key) || fallback; } catch { return fallback; } };
const view = {
  list: remember("tab:list", "queued"),
  progress: remember("tab:progress", "active"),
  page: { active: 1, collected: 1 },
};
let lastData = null;   // 탭·페이지를 바꿀 때 서버를 다시 부르지 않고 바로 다시 그린다

function showTabs() {
  for (const tab of document.querySelectorAll("[role=tab]")) {
    const group = tab.closest("[data-group]").dataset.group;
    const selected = view[group] === tab.dataset.tab;
    tab.setAttribute("aria-selected", selected);
    tab.tabIndex = selected ? 0 : -1;
  }
  for (const panel of document.querySelectorAll("[role=tabpanel][data-group]")) {
    panel.hidden = view[panel.dataset.group] !== panel.dataset.tab;
  }
  $("progress-panel").setAttribute("aria-labelledby", `tab-progress-${view.progress}`);
}

for (const tab of document.querySelectorAll("[role=tab]")) {
  tab.onclick = () => {
    const group = tab.closest("[data-group]").dataset.group;
    view[group] = tab.dataset.tab;
    try { localStorage.setItem(`tab:${group}`, view[group]); } catch {}
    showTabs();
    if (lastData) render(lastData);
  };
}

function pagerButtons(page, pages) {
  // 1 … 4 5 [6] 7 8 … 20 처럼 양 끝과 현재 주변만 보여 준다
  const shown = [...new Set([1, pages, page - 2, page - 1, page, page + 1, page + 2])]
    .filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
  const go = (n) => () => {
    view.page[view.progress] = n;
    render(lastData);
    $("progress-card").scrollIntoView({ block: "nearest" });
  };
  const items = [button("‹ 이전", "이전 페이지", go(page - 1), { disabled: page === 1, className: "" })];
  shown.forEach((n, i) => {
    if (i && n - shown[i - 1] > 1) items.push(el("span", { className: "gap", textContent: "…" }));
    const b = button(String(n), `${n}페이지`, go(n), { className: "" });
    if (n === page) b.setAttribute("aria-current", "page");
    items.push(b);
  });
  items.push(button("다음 ›", "다음 페이지", go(page + 1), { disabled: page === pages, className: "" }));
  return items;
}

const say = (text, cls = "") => { $("message").textContent = text; $("message").className = cls; };

// DB 의 시각은 UTC. 화면에는 내 PC 시간으로 보여 준다.
const localTime = (utc) => new Date(utc.replace(" ", "T") + "Z").toLocaleTimeString();

async function loadSites() {
  const sites = await api("/api/sites");
  $("sites").replaceChildren(...sites.map((site) => {
    const box = el("input", { type: "checkbox", value: site.name, checked: site.configured, disabled: !site.configured });
    const result = el("small", {}, site.configured ? "" : "키 없음");
    const button = el("button", { className: "small", textContent: "연결 확인" });
    button.onclick = async () => {
      result.textContent = "확인 중…"; result.className = "";
      const answer = await api(`/api/sites/${site.name}/check`, { method: "POST" });
      result.textContent = answer.message; result.className = answer.ok ? "ok" : "bad";
    };
    return el("label", { className: "site" }, box, site.name, button, result);
  }));
}

async function submit() {
  const sites = [...document.querySelectorAll("#sites input:checked")].map((box) => box.value);
  try {
    const answer = await api("/api/jobs", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ keywords: $("keywords").value, sites }),
    });
    say(`등록: ${answer.keywords.join(", ")} → ${answer.sites.join(", ")}`, "ok");
    $("keywords").value = "";
    refresh();
  } catch (error) { say(error.message, "bad"); }
}

const send = async (path, options = {}) => {
  try {
    await api(path, { headers: { "Content-Type": "application/json" }, ...options });
    refresh();
  } catch (error) { say(error.message, "bad"); }
};
const button = (text, label, onclick, { disabled = false, className = "small" } = {}) =>
  el("button", { className, textContent: text, title: label, ariaLabel: label, disabled, onclick });
const savedOf = (keyword) => keyword.jobs.reduce((sum, job) => sum + job.downloaded, 0);
const localDateTime = (utc) => new Date(utc.replace(" ", "T") + "Z").toLocaleString();

// 수집 예약: 순서 바꾸기 · 보류 · 삭제. 지금 수집 중인 작업은 순서를 바꿔도 끝까지 하고, 다음 작업부터 새 순서를 따른다.
function queuedItem(keyword, index, queued) {
  const [label, cls] = keyword.held ? ["보류", "warn"] : (STATUS[keyword.status] || [keyword.status, ""]);
  const move = (delta) => {
    const ids = queued.map((item) => item.id);
    [ids[index], ids[index + delta]] = [ids[index + delta], ids[index]];
    send("/api/keywords/order", { method: "PUT", body: JSON.stringify({ ids }) });
  };
  const name = keyword.keyword;
  return el("li", { className: keyword.held ? "held" : "" },
    el("span", { className: "kw", textContent: name }),
    el("span", { className: `meta ${cls}`, textContent: label }),
    el("span", { className: "meta muted", textContent: `${savedOf(keyword).toLocaleString()}장` }),
    el("span", { className: "actions" },
      button("↑", `${name} 위로`, () => move(-1), { disabled: index === 0 }),
      button("↓", `${name} 아래로`, () => move(1), { disabled: index === queued.length - 1 }),
      keyword.held
        ? button("보류 해제", `${name} 보류 해제`, () => send(`/api/keywords/${keyword.id}/resume`, { method: "POST" }))
        : button("보류", `${name} 보류`, () => send(`/api/keywords/${keyword.id}/hold`, { method: "POST" })),
      button("삭제", `${name} 삭제`, () => {
        if (confirm(`'${name}' 키워드를 삭제할까요?
수집 기록은 지워지고, 이미 받은 이미지 파일은 남습니다.`))
          send(`/api/keywords/${keyword.id}`, { method: "DELETE" });
      }, { className: "small danger" })));
}

function collectedItem(keyword) {
  return el("li", {},
    el("span", { className: "kw", textContent: keyword.keyword }),
    el("span", { className: "meta muted", textContent: `${savedOf(keyword).toLocaleString()}장` }),
    el("span", { className: "meta muted", textContent: keyword.finished_at ? localDateTime(keyword.finished_at) : "" }));
}

// 수집 중(대기·보류 포함)은 서버가 준 수집 순서 그대로, 수집 완료는 끝난 순서로
const split = (keywords) => ({
  queued: keywords.filter((keyword) => keyword.status !== "collected"),
  collected: keywords.filter((keyword) => keyword.status === "collected")
    .sort((a, b) => (a.finished_at || "").localeCompare(b.finished_at || "")),
});

function renderKeywordLists({ queued, collected }) {
  $("count-list-queued").textContent = queued.length;
  $("count-list-collected").textContent = collected.length;
  const empty = (text) => el("li", { className: "empty", textContent: text });
  $("queued").replaceChildren(...(queued.length ? queued.map((k, i) => queuedItem(k, i, queued)) : [empty("예약된 키워드가 없습니다.")]));
  $("collected").replaceChildren(...(collected.length ? collected.map(collectedItem) : [empty("아직 수집을 마친 키워드가 없습니다.")]));
}

function jobRow(job) {
  const [label, cls] = STATUS[job.status] || [job.status, ""];
  // 진행바 분모는 사이트가 알려 준 '이 키워드로 받을 수 있는 전체 수'. 첫 검색 페이지를 받아야 알 수 있다.
  // 분자는 확인을 마친 장수(저장 + 중복 + 건너뜀 + 실패).
  const total = job.total_available;
  const checked = job.downloaded + job.duplicates + job.skipped + job.errors;
  const progress = total == null
    ? el("span", { className: "muted", textContent: "전체 수 확인 전" })
    : [el("progress", { max: Math.max(total, 1), value: Math.min(checked, total) }),
       el("span", { className: "ratio", textContent: `${checked.toLocaleString()} / ${total.toLocaleString()}` })];
  let note = "";
  if (job.resume_at && (job.status === "paused" || job.status === "rate_limited")) note = `${localTime(job.resume_at)} 재개`;
  if (job.last_error && (job.status === "paused" || job.status === "failed")) note += ` · ${job.last_error}`;
  const num = (value) => el("td", { className: "num", textContent: value });
  return el("tr", {},
    el("td", { textContent: job.site }), el("td", { className: cls, textContent: label }),
    el("td", {}, ...[progress].flat()), num(job.downloaded), num(job.duplicates), num(job.skipped), num(job.errors),
    el("td", { className: "error muted", textContent: note }));
}

async function refresh() {
  try {
    const data = await api("/api/progress");
    $("running").textContent = data.running ? "수집기 동작 중" : "수집기 멈춤";
    $("limit").textContent = data.max_downloads
      ? `키워드×사이트마다 최대 ${data.max_downloads.toLocaleString()}장까지 저장합니다 (.env 의 MAX_DOWNLOADS)` : "";
    $("toggle").textContent = data.running ? "중단" : "재개";
    $("toggle").onclick = async () => {
      await api(`/api/collector/${data.running ? "stop" : "start"}`, { method: "POST" });
      refresh();
    };
    lastData = data;
    render(data);
  } catch (error) { $("running").textContent = "서버에 연결할 수 없음"; }
}

function renderProgress({ queued, collected }) {
  $("count-progress-active").textContent = queued.length;
  $("count-progress-collected").textContent = collected.length;

  const tab = view.progress;
  const keywords = tab === "active" ? queued : collected;
  const pages = Math.max(1, Math.ceil(keywords.length / PAGE_SIZE));
  const page = view.page[tab] = Math.min(Math.max(view.page[tab], 1), pages);   // 키워드가 줄어 페이지가 사라진 경우
  const start = (page - 1) * PAGE_SIZE;

  const rows = keywords.slice(start, start + PAGE_SIZE).flatMap((keyword) => {
    const [label] = STATUS[keyword.status] || [keyword.status];
    const held = keyword.held ? " · 보류" : "";
    const finished = keyword.finished_at ? ` · ${localDateTime(keyword.finished_at)}` : "";
    const head = el("tr", { className: "keyword" },
      el("td", { colSpan: 8, textContent: `${keyword.keyword} — ${label}${held}${finished}` }));
    return [head, ...keyword.jobs.map(jobRow)];
  });
  const empty = tab === "active" ? "진행 중인 키워드가 없습니다." : "아직 수집을 마친 키워드가 없습니다.";
  $("progress").replaceChildren(...(rows.length ? rows
    : [el("tr", {}, el("td", { colSpan: 8, className: "muted", textContent: empty }))]));

  const range = keywords.length ? `${start + 1}–${Math.min(start + PAGE_SIZE, keywords.length)}` : "0";
  $("pager").replaceChildren(
    el("span", { className: "total", textContent: `키워드 ${keywords.length.toLocaleString()}개 중 ${range}` }),
    ...(pages > 1 ? pagerButtons(page, pages) : []));
}

function render(data) {
  const groups = split(data.keywords);
  renderKeywordLists(groups);
  renderProgress(groups);
}

showTabs();
$("submit").onclick = submit;
$("keywords").onkeydown = (event) => { if (event.key === "Enter") submit(); };
loadSites();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
